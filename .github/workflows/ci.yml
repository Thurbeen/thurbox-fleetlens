# What CI proves: the Lua is sound and stays inside the mod sandbox, the pure
# modules behave, and the pane works end to end against a real thurbox and a
# real fleet.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# The release the pane is tested against. The vendored thurbox.yml must match
# THURBOX_TAG; its release ships both thurbox and fleet.
env:
  THURBOX_TAG: v3.24.0

jobs:
  lint:
    name: Lua
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Thurbeen/thurbox
          ref: ${{ env.THURBOX_TAG }}
          path: .thurbox
          sparse-checkout: thurbox.yml
          sparse-checkout-cone-mode: false
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        with:
          tool: selene,stylua
      - name: The sandbox contract matches the pinned tag
        run: diff -u .thurbox/thurbox.yml thurbox.yml
      - run: selene .
      - run: stylua --check .

  test:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Lua 5.4
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq lua5.4
      - run: tests/run.sh

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tmux
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq tmux
      - name: Fetch thurbox and fleet
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/bin"
          archive="thurbox-${THURBOX_TAG}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/Thurbeen/thurbox/releases/download/${THURBOX_TAG}"
          curl -sSfL -o "$archive" "$base/$archive"
          curl -sSfL -o sums.txt "$base/thurbox-${THURBOX_TAG#v}-sha256sums.txt"
          grep "  $archive\$" sums.txt | sha256sum -c -
          tar xzf "$archive" thurbox thurbox-cli fleet
          ./fleet --version
          ./thurbox-cli version --json
      - name: Lens lists Tasks; Unknown is not empty
        run: THURBOX_BIN="$RUNNER_TEMP/bin" FLEET_BIN="$RUNNER_TEMP/bin" tests/e2e/lens_lists_tasks.sh
